# Same-origin reverse proxy, mirroring the Vite dev proxy: the browser only talks to this
# server, so auth cookies and CSRF work without CORS. "backend" is the compose service name.
upstream construx_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects relative so they do not leak the container port behind a published one
    absolute_redirect off;

    # Above the backend's 2 MB multipart limit so it returns its own validation error
    client_max_body_size 5m;

    # API plus the Spring Security OAuth2 login endpoints; Spring Security sets its own security headers
    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://construx_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend rate-limits per client and trusts this header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Hashed build assets never change
    location /assets/ {
        include security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html, which is never cached
    location / {
        include security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
